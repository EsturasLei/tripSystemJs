<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Diver Managment System</h1>
        <hr>
        <h2 id="formTitle"> Create New Trip</h2>
        <div id="errorMessage" class="error"></div>
        <div id="message" class="message"></div>
        <form id="requestForm">
            <input type="hidden" id="requestId" value="">   
            
            <input type="text" id="requestor" placeholder="Requestor Full Name" required>
            
            <input type="date" id="date" placeholder="Choose Date" required>
            <p>Start Time: <input type="time" id="timeStart" placeholder="Time Start" required></p> 
            <p>End Time: <input type="time" id="timeEnd" placeholder="Time End" required></p>
            <input type="text" id="purpose" placeholder="Purpose" required>
            <input type="file" placeholder="Supporting Document">
            <label>Passengers</label>


        <div id="passengerList">
            <div class="passenger-row">
                <span class="number">1.</span>
                <input
                    type="text"
                    class="passenger-input"
                    placeholder="Passenger name"
                >
                <button type="button" class="add-passenger">+</button>
                <button type="button" class="remove-passenger">X</button>
            </div>
        </div>
                        
            
            
            <div style="display: flex; gap: 10px;">
                <button type="submit" id="submitBtn">Create Trip</button>
                <button type="button" id="cancelEditBtn" style="background-color: var(--text-muted); display: none;">Cancel Edit</button>
            </div>
        </form>
        
        <hr>

        <h2>Trip Requests</h2>
        
        <div id="tripList">
            <p>Loading trip requests...</p>
        </div>

    </div>
    <script src="/js/requestForm.js"></script>
</body>
</html>
