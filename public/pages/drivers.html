<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Diver Managment System</h1>
        <hr>
        <h2>Add New Driver</h2>
        <div id="errorMessage" class="error"></div>
        <form id="driverForm">
            <input type="text" id="driverName" placeholder="Driver Full Name" required>
            <input type="text" id="licenseNumber" placeholder="license Number (e.g., DL-12345)" required>
            <button type="submit">Add Driver</button>
        </form>

        <h2>Current Driver</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>License Number</th>
                </tr>
            </thead>
            <tbody id="driverTableBody"></tbody>
        </table>
    </div>
    <script src="/js/driver.js"></script>
</body>
</html>
