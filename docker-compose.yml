services:
  db:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  app:
    image: node:20
    container_name: node-app
    working_dir: /app
    volumes:
      - .:/app
    command: tail -f /dev/null
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  pgdata:
